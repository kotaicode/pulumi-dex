
services:
  dex:
    # Pinned to the Dex v2.46.1 release by digest, as in CI. The release image is
    # Alpine-based (v2.46.1-alpine is the same image), so the healthcheck has wget.
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    container_name: dex
    ports:
      - "5556:5556"  # Dex web UI
      - "5557:5557"  # Dex gRPC API without TLS (local only): set plaintext: true in the provider
    volumes:
      - ./examples/dex-config.yaml:/etc/dex/config.yaml:ro
    environment:
      - DEX_API_CONNECTORS_CRUD=true
    command: dex serve /etc/dex/config.yaml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5556/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

