name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7

      - name: Cache Go modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('provider/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: cd provider && go mod download

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # The provider binary reports provider.Version, and that value becomes the
      # schema version and therefore the plugin version stamped into every SDK
      # (package.json "pulumi.version", pulumi-plugin.json). It MUST come from the
      # tag, never from the Makefile/version.go default, or `pulumi install` will
      # try to download a release that does not exist.
      - name: Build provider
        run: make build VERSION=${{ steps.version.outputs.version }}

      - name: Install provider for schema generation
        run: |
          pulumi plugin install resource dex ${{ steps.version.outputs.version }} --file bin/pulumi-resource-dex

      - name: Generate schema.json
        run: make generate-schema VERSION=${{ steps.version.outputs.version }}
      - name: Generate SDKs
        run: make generate-sdks VERSION=${{ steps.version.outputs.version }}

      - name: Verify plugin version in schema and SDKs matches the tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          fail=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 has version '$2', expected '$VERSION'"
              fail=1
            else
              echo "✓ $1 = $2"
            fi
          }
          check schema.json "$(jq -r .version schema.json)"
          check "nodejs package.json version" "$(jq -r .version sdk/typescript/nodejs/package.json)"
          check "nodejs package.json pulumi.version" "$(jq -r .pulumi.version sdk/typescript/nodejs/package.json)"
          check "python pulumi-plugin.json" "$(jq -r .version sdk/python/python/pulumi_dex/pulumi-plugin.json)"
          check "go pulumi-plugin.json" "$(jq -r .version sdk/go/dex/pulumi-plugin.json)"
          # Go users download the committed sdk/ at the tag, not the files regenerated above
          check "go pulumi-plugin.json (committed)" "$(git show HEAD:sdk/go/dex/pulumi-plugin.json | jq -r .version)"
          mod=$(git show HEAD:sdk/go.mod | awk '/^module /{print $2}')
          if [ "$mod" != "github.com/kotaicode/pulumi-dex/sdk" ]; then
            echo "::error::sdk/go.mod declares module '$mod', expected github.com/kotaicode/pulumi-dex/sdk"
            fail=1
          fi
          exit $fail

      - name: Ensure README.md exists for TypeScript SDK
        run: |
          # Ensure README.md exists after SDK generation
          if [ ! -f sdk/typescript/nodejs/README.md ] || [ ! -s sdk/typescript/nodejs/README.md ]; then
            echo "⚠ README.md missing or empty after SDK generation"
            if [ -f README.md ]; then
              echo "Copying README.md from repository root..."
              cp README.md sdk/typescript/nodejs/README.md
            else
              echo "⚠ ERROR: No README.md found!"
              exit 1
            fi
          fi
          echo "✓ README.md verified (size: $(wc -c < sdk/typescript/nodejs/README.md) bytes)"

      # The Go SDK is a nested module in sdk/, so `go get .../sdk@vX.Y.Z`
      # resolves the tag sdk/vX.Y.Z, not vX.Y.Z.
      - name: Tag Go SDK module
        run: |
          TAG=sdk/v${{ steps.version.outputs.version }}
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists (re-run), skipping"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Upload TypeScript SDK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: typescript-sdk
          path: sdk/typescript/nodejs/**
          retention-days: 1

      - name: Ensure README.md exists for Python SDK
        run: |
          # Ensure README.md exists after SDK generation
          if [ ! -f sdk/python/python/README.md ] || [ ! -s sdk/python/python/README.md ]; then
            echo "⚠ README.md missing or empty after SDK generation"
            if [ -f README.md ]; then
              echo "Copying README.md from repository root..."
              cp README.md sdk/python/python/README.md
            else
              echo "⚠ ERROR: No README.md found!"
              exit 1
            fi
          fi
          echo "✓ README.md verified (size: $(wc -c < sdk/python/python/README.md) bytes)"

      - name: Upload Python SDK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-sdk
          path: sdk/python/python/**
          retention-days: 1

      - name: Generate package-lock.json for TypeScript SDK
        run: |
          cd sdk/typescript/nodejs
          npm install  # Generate package-lock.json for future npm ci
          echo "✓ package-lock.json generated"
          # Verify README.md is still present
          if [ ! -f README.md ] || [ ! -s README.md ]; then
            echo "⚠ ERROR: README.md missing after npm install!"
            exit 1
          fi
          echo "✓ README.md still present after npm install"

      - name: Build provider binaries for all platforms
        run: |
          mkdir -p release
          VERSION=${{ steps.version.outputs.version }}
          cd provider
          GOOS=linux GOARCH=amd64 go build -ldflags "-X 'github.com/kotaicode/pulumi-dex/pkg/provider.Version=${VERSION}'" -o ../release/pulumi-resource-dex-linux-amd64 ./cmd/pulumi-resource-dex
          GOOS=linux GOARCH=arm64 go build -ldflags "-X 'github.com/kotaicode/pulumi-dex/pkg/provider.Version=${VERSION}'" -o ../release/pulumi-resource-dex-linux-arm64 ./cmd/pulumi-resource-dex
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X 'github.com/kotaicode/pulumi-dex/pkg/provider.Version=${VERSION}'" -o ../release/pulumi-resource-dex-darwin-amd64 ./cmd/pulumi-resource-dex
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X 'github.com/kotaicode/pulumi-dex/pkg/provider.Version=${VERSION}'" -o ../release/pulumi-resource-dex-darwin-arm64 ./cmd/pulumi-resource-dex
          GOOS=windows GOARCH=amd64 go build -ldflags "-X 'github.com/kotaicode/pulumi-dex/pkg/provider.Version=${VERSION}'" -o ../release/pulumi-resource-dex-windows-amd64.exe ./cmd/pulumi-resource-dex

      - name: Package binaries as tar.gz
        run: |
          cd release
          VERSION=${{ steps.version.outputs.version }}
          # Package Linux binaries
          tar -czf pulumi-resource-dex-v${VERSION}-linux-amd64.tar.gz pulumi-resource-dex-linux-amd64
          tar -czf pulumi-resource-dex-v${VERSION}-linux-arm64.tar.gz pulumi-resource-dex-linux-arm64
          # Package Darwin (macOS) binaries
          tar -czf pulumi-resource-dex-v${VERSION}-darwin-amd64.tar.gz pulumi-resource-dex-darwin-amd64
          tar -czf pulumi-resource-dex-v${VERSION}-darwin-arm64.tar.gz pulumi-resource-dex-darwin-arm64
          # Package Windows binary (tar.gz format per Pulumi spec)
          tar -czf pulumi-resource-dex-v${VERSION}-windows-amd64.tar.gz pulumi-resource-dex-windows-amd64.exe
          echo "✓ Binaries packaged"

      - name: Create checksums
        run: |
          cd release
          sha256sum pulumi-resource-dex-v*.tar.gz > checksums.txt
          echo "✓ Checksums created"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/pulumi-resource-dex-v*.tar.gz
            release/checksums.txt
            schema.json
          generate_release_notes: true
          body: |
            ## Installation

            ### Provider Binary

            Download the appropriate binary for your platform from the assets below.

            ### TypeScript SDK

            ```bash
            npm install @kotaicode/pulumi-dex@${{ steps.version.outputs.version }}
            ```

            ### Go SDK

            ```bash
            go get github.com/kotaicode/pulumi-dex/sdk@v${{ steps.version.outputs.version }}
            ```

            ```go
            import "github.com/kotaicode/pulumi-dex/sdk/go/dex"
            ```

            See [README.md](https://github.com/kotaicode/pulumi-dex#readme) for full installation and usage instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download TypeScript SDK artifact
        uses: actions/download-artifact@v8
        with:
          name: typescript-sdk
          path: sdk/typescript/nodejs

      - name: Verify README.md exists in SDK
        run: |
          if [ ! -f sdk/typescript/nodejs/README.md ] || [ ! -s sdk/typescript/nodejs/README.md ]; then
            echo "⚠ ERROR: README.md missing or empty in downloaded SDK!"
            echo "Falling back to repository README.md..."
            if [ -f README.md ]; then
              cp README.md sdk/typescript/nodejs/README.md
            else
              echo "⚠ ERROR: No README.md found anywhere!"
              exit 1
            fi
          fi
          echo "✓ README.md verified (size: $(wc -c < sdk/typescript/nodejs/README.md) bytes)"
          echo "First 3 lines:"
          head -3 sdk/typescript/nodejs/README.md

      # - name: Update package.json version
      #   run: |
      #     cd sdk/typescript/nodejs
      #     npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Install npm dependencies
        run: |
          cd sdk/typescript/nodejs
          # Use npm install if package-lock.json doesn't exist, otherwise npm ci
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build TypeScript SDK
        run: |
          cd sdk/typescript/nodejs
          npm run build

      - name: Verify README.md is included in package
        run: |
          cd sdk/typescript/nodejs
          if [ ! -f README.md ] || [ ! -s README.md ]; then
            echo "⚠ ERROR: README.md is missing or empty before publish!"
            exit 1
          fi
          echo "✓ README.md verified (size: $(wc -c < README.md) bytes)"
          # Show first few lines to confirm content
          echo "First 5 lines of README.md:"
          head -5 README.md

      - name: Check if NPM_TOKEN is set
        id: check-npm-token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠ NPM_TOKEN not set, skipping publish"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✓ NPM_TOKEN is set, will publish"
          fi

      # Publish the compiled output, the way Pulumi's own providers do. The
      # generated package.json has no "main", so the package root must BE the
      # build output. Publishing from sdk/typescript/nodejs shipped only .ts
      # sources (bin/ is excluded by the generated .gitignore), which Node and
      # ts-node refuse to load from node_modules.
      - name: Assemble npm package from build output
        run: |
          cd sdk/typescript/nodejs
          cp package.json README.md bin/
          test -f bin/index.js
          test -f bin/index.d.ts
          echo "✓ bin/ contains compiled JS and type declarations"

      - name: Smoke-test the packed package
        run: |
          cd sdk/typescript/nodejs/bin
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/sdk/typescript/nodejs/bin/*.tgz
          node -e "const d=require('@kotaicode/pulumi-dex'); if (typeof d.resources.Client !== 'function') process.exit(1)"
          echo "✓ package loads with plain Node"
          rm "$GITHUB_WORKSPACE"/sdk/typescript/nodejs/bin/*.tgz

      - name: Publish to NPM
        run: |
          cd sdk/typescript/nodejs/bin
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Only publish if NPM_TOKEN secret is set (optional for first release)
        if: steps.check-npm-token.outputs.has_token == 'true'

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Python SDK artifact
        uses: actions/download-artifact@v8
        with:
          name: python-sdk
          path: sdk/python/python

      - name: Verify README.md exists in SDK
        run: |
          if [ ! -f sdk/python/python/README.md ] || [ ! -s sdk/python/python/README.md ]; then
            echo "⚠ ERROR: README.md missing or empty in downloaded SDK!"
            echo "Falling back to repository README.md..."
            if [ -f README.md ]; then
              cp README.md sdk/python/python/README.md
            else
              echo "⚠ ERROR: No README.md found anywhere!"
              exit 1
            fi
          fi
          echo "✓ README.md verified (size: $(wc -c < sdk/python/python/README.md) bytes)"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        run: |
          cd sdk/python/python
          python -m build

      - name: Verify package files
        run: |
          cd sdk/python/python
          ls -lh dist/
          echo "✓ Package files built successfully"

      - name: Check if PyPI credentials are configured
        id: check-pypi
        run: |
          # Check for trusted publishing (OIDC) - this is the recommended method
          # If trusted publishing is set up on PyPI, the pypa action will use it automatically
          # Otherwise, check for API token fallback
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠ PYPI_API_TOKEN not set, will attempt trusted publishing (OIDC)"
            echo "If trusted publishing is not configured on PyPI, publish will fail"
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "✓ PYPI_API_TOKEN is set, will use API token"
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/python/dist/
          verbose: true
        env:
          # Only needed if not using trusted publishing (OIDC)
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        # Only publish if credentials are available OR trusted publishing is configured
        # Note: The action will fail if neither is available, which is expected

