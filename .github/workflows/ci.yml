name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Install dependencies
        run: cd provider && go mod download

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: provider
          args: --timeout=5m --build-tags=dexlive

      - name: Run tests
        run: cd provider && go test ./pkg/... -v -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: provider/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Install dependencies
        run: cd provider && go mod download

      - name: Build provider
        run: make build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulumi-resource-dex-${{ matrix.os }}
          path: bin/pulumi-resource-dex*

  # Lifecycle suite (provider/pkg/provider/resources/live_dex_test.go) against
  # each supported Dex line. Images are pinned by digest; Dex serves its API
  # without TLS, published only on the runner's loopback.
  dex-compatibility:
    name: Dex compatibility (${{ matrix.dex.version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dex:
          - version: v2.45.1
            image: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
          - version: v2.46.1
            image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Start Dex ${{ matrix.dex.version }}
        run: |
          docker run -d --name dex -p 127.0.0.1:5557:5557 -e DEX_API_CONNECTORS_CRUD=true \
            -v "$PWD/test/dex/config.yaml:/etc/dex/config.yaml:ro" \
            "${{ matrix.dex.image }}" dex serve /etc/dex/config.yaml
          for i in $(seq 1 30); do
            if timeout 1 bash -c "echo > /dev/tcp/127.0.0.1/5557" 2>/dev/null; then
              echo "Dex is ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::Dex ${{ matrix.dex.version }} did not start"; docker logs dex; exit 1

      - name: Run the lifecycle suite
        run: cd provider && go test ./pkg/provider/resources/ -tags=dexlive -run Live -count=1 -v
        env:
          DEX_LIVE_HOST: 127.0.0.1:5557
          DEX_LIVE_VERSION: ${{ matrix.dex.version }}

      - name: Dex logs
        if: failure()
        run: docker logs dex

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Start Dex
        run: make dex-up
        env:
          DEX_API_CONNECTORS_CRUD: "true"

      - name: Wait for Dex to be ready
        run: |
          timeout=30
          elapsed=0
          while ! timeout 1 bash -c "echo > /dev/tcp/localhost/5557" 2>/dev/null; do
            if [ $elapsed -ge $timeout ]; then
              echo "Dex failed to start within $timeout seconds"
              docker compose logs
              exit 1
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          echo "Dex is ready"

      - name: Run integration tests
        run: |
          cd provider && go test ./... -tags=integration -v
        env:
          DEX_HOST: "localhost:5557"
          DEX_INSECURE_SKIP_VERIFY: "true"

      - name: Stop Dex
        if: always()
        run: make dex-down

  sdk-generation:
    name: SDK Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Install Pulumi CLI
        uses: pulumi/actions@0ce33695f880624d4f27bd6db25e680c7df4d551 # v7.2.0
        with:
          pulumi-version-file: .pulumi.version

      - name: Install dependencies
        run: cd provider && go mod download

      - name: Generate schema and SDKs
        run: make generate-sdks

      # The committed schema and SDKs must be exactly what the generator produces
      # from this commit. No files are excluded: two consecutive generations with
      # the pinned CLI are identical.
      - name: Check that schema.json and sdk/ are up to date
        run: |
          drift=$(git status --porcelain -- schema.json sdk/)
          if [ -n "$drift" ]; then
            echo "::error::schema.json or sdk/ differs from the generated output. Run make generate-sdks with Pulumi CLI $(cat .pulumi.version) and commit the result."
            echo "$drift"
            git diff --stat -- schema.json sdk/
            exit 1
          fi
          echo "✓ schema.json and sdk/ match the generated output"

      - name: Test TypeScript SDK
        run: |
          cd sdk/typescript/nodejs
          npm install
          npm run build
          # Same layout the release publishes: compiled output at the package root
          cp package.json README.md bin/
          node -e "const d=require('./bin'); if (typeof d.resources.Client !== 'function') process.exit(1)"
          echo "✓ compiled SDK loads with plain Node"

