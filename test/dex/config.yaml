# Dex for the compatibility suite in CI (.github/workflows/ci.yml, job dex-compatibility).
# Disposable: memory storage, no TLS, reachable only on the runner's loopback.
issuer: http://127.0.0.1:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
grpc:
  addr: 0.0.0.0:5557
enablePasswordDB: true
